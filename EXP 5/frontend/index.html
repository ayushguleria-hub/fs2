<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1>Post Management System</h1>
            <p>Manage your posts easily</p>
        </div>
    </header>


    <!-- Main Content -->
    <main class="container">

        <!-- Create / Update Post Section -->
        <section class="post-form-section">

            <h2 id="form-title">Create New Post</h2>

            <form id="post-form">

                <div class="form-group">
                    <label for="title">Title</label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter post title"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="content">Content</label>

                    <textarea
                        id="content"
                        name="content"
                        rows="6"
                        placeholder="Enter post content"
                        required
                    ></textarea>
                </div>


                <div class="form-buttons">

                    <button
                        type="submit"
                        id="submit-btn"
                        class="btn primary-btn">
                        Create Post
                    </button>

                    <button
                        type="button"
                        id="cancel-btn"
                        class="btn secondary-btn"
                        onclick="cancelEdit()"
                        style="display: none;">
                        Cancel
                    </button>

                </div>

            </form>

            <!-- Error / Success Message -->
            <div id="message" class="message"></div>

        </section>


        <!-- Posts Section -->
        <section class="posts-section">

            <div class="section-header">

                <h2>All Posts</h2>

                <button
                    class="btn refresh-btn"
                    onclick="loadPosts()">
                    Refresh
                </button>

            </div>


            <!-- Posts will be inserted here using JavaScript -->
            <div id="posts-container">

                <p class="loading">
                    Loading posts...
                </p>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            Post Management System |
            Spring Boot + MySQL
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
